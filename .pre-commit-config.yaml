repos:
- repo: local
  hooks:
  - id: trufflehog
    name: TruffleHog
    description: Detect secrets in your data.
    entry: bash -c 'trufflehog filesystem . --config=trufflehog-config.yaml --fail --no-update --exclude-paths=exclude-patterns.txt'
    language: system
    stages: ["commit", "push"]
    pass_filenames: false
