repos:
- repo: local
  hooks:
  - id: trufflehog
    name: TruffleHog
    description: Detect secrets in your data.
    entry: bash -c 'trufflehog filesystem . --config=trufflehog-config.yaml --results=verified,unknown --fail --no-update'
    language: system
    stages: ["commit", "push"]
    pass_filenames: false
